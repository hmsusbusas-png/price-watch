[project]
name = "pricewatch"
version = "2.0.0"
description = "Price tracker for Wildberries and any web page: history in SQLite, charts, Excel export, Telegram alerts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "openpyxl>=3.1.5,<4",
    "matplotlib>=3.9,<4",
]

[project.scripts]
pricewatch = "pricewatch.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricewatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Cyrillic letters look like Latin ones to RUF001-003; in a Russian-language CLI that is expected.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
